
<div class="container mt-4">
  @if (user(); as user) {
    <div class="row">
      <div class="col">
        <div class="btn-group float-end">
          <a class="btn btn-secondary" routerLink="/account">Logged in as: {{user.name}}</a>
          <a routerLink="/logout" class="btn btn-primary">Logout</a>
        </div>
      </div>
    </div>
  }
  <div class="row">
    <div class="col">
      <div class="mt-3">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
